services:
  - type: web
    name: solivo-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: solivo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: APP_URL
        value: https://solivo.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://web-ten-kappa-35.vercel.app,https://solivo.vercel.app,https://solivo.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: solivo-db
    databaseName: solivo
    plan: free
